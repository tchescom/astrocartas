<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
/* ============================================================
   ORÁCULO MÍSTICO — Tarot Premium
   ============================================================ */

*,*::before,*::after{
  box-sizing:border-box;
  margin:0;
  padding:0
}

html,body{
  height:100%;
  width:100%;
  overflow-x:hidden
}

:root{
  --roxo:#1a0625;
  --roxo-2:#2b0a3d;
  --vinho:#4a0e2c;
  --vinho-2:#6b1538;
  --dourado:#d4af37;
  --dourado-claro:#f5d97a;
  --dourado-glow:rgba(212,175,55,.55);
  --noite:#070016;
  --azul-noite:#0a1240;
  --branco:#f7ecd9;
  --texto:#ede1c7;
}

body{
  font-family:'Cormorant Garamond',serif;
  color:var(--texto);
  background:
    radial-gradient(ellipse at 20% 10%, #3a0a5c 0%, transparent 55%),
    radial-gradient(ellipse at 80% 90%, #4a0e2c 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, #0a1240 0%, transparent 70%),
    linear-gradient(180deg,#070016 0%, #150028 50%, #070016 100%);
  background-attachment:fixed;
  min-height:100vh;
  position:relative;
}

/* ---------- Estrelas ---------- */
.stars,.stars2,.stars3{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0
}

.stars{
  background-image:
    radial-gradient(1px 1px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 40px 70px, #fff, transparent),
    radial-gradient(1px 1px at 90px 40px, #f5d97a, transparent),
    radial-gradient(1px 1px at 130px 80px, #fff, transparent),
    radial-gradient(2px 2px at 160px 30px, #fff, transparent);
  background-repeat:repeat;
  background-size:200px 200px;
  animation:drift 120s linear infinite;
  opacity:.7
}

.stars2{
  background-image:
    radial-gradient(1px 1px at 50px 50px, #fff, transparent),
    radial-gradient(2px 2px at 100px 150px, #f5d97a, transparent),
    radial-gradient(1px 1px at 180px 100px, #fff, transparent);
  background-repeat:repeat;
  background-size:300px 300px;
  animation:drift 200s linear infinite reverse;
  opacity:.5
}

.stars3{
  background-image:
    radial-gradient(1.5px 1.5px at 80px 200px, #d4af37, transparent),
    radial-gradient(1px 1px at 250px 80px, #fff, transparent);
  background-repeat:repeat;
  background-size:400px 400px;
  animation:twinkle 6s ease-in-out infinite;
  opacity:.6
}

@keyframes drift{
  from{transform:translateY(0)}
  to{transform:translateY(-2000px)}
}

@keyframes twinkle{
  0%,100%{opacity:.3}
  50%{opacity:.9}
}

/* ---------- Névoa ---------- */
.fog{
  position:fixed;
  inset:-20%;
  pointer-events:none;
  z-index:1;
  background:
    radial-gradient(circle at 30% 40%, rgba(106,30,150,.25), transparent 40%),
    radial-gradient(circle at 70% 60%, rgba(75,15,80,.25), transparent 40%);
  filter:blur(40px);
  animation:fog 30s ease-in-out infinite alternate
}

@keyframes fog{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(-5%,5%) scale(1.1)}
}

/* ---------- Partículas ---------- */
.particles{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:2;
  overflow:hidden
}

.particle{
  position:absolute;
  bottom:-10px;
  width:4px;
  height:4px;
  border-radius:50%;
  background:radial-gradient(circle,var(--dourado-claro),transparent 70%);
  box-shadow:0 0 8px var(--dourado-glow);
  animation:rise linear infinite
}

@keyframes rise{
  0%{
    transform:translateY(0) translateX(0);
    opacity:0
  }
  10%{opacity:1}
  90%{opacity:1}
  100%{
    transform:translateY(-110vh) translateX(40px);
    opacity:0
  }
}

/* ---------- Header ---------- */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 1.5rem;
  background:linear-gradient(180deg,rgba(7,0,22,.7),transparent);
  backdrop-filter:blur(6px)
}

.brand{
  font-family:'Cinzel Decorative',serif;
  color:var(--dourado);
  font-size:1.1rem;
  letter-spacing:.2em
}

.controls{
  display:flex;
  gap:.6rem
}

.ctrl{
  background:rgba(212,175,55,.08);
  border:1px solid rgba(212,175,55,.4);
  color:var(--dourado);
  padding:.5rem .8rem;
  border-radius:30px;
  cursor:pointer
}

/* ---------- Main ---------- */
main{
  position:relative;
  z-index:10;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:6rem 1.2rem 4rem;
  text-align:center
}

/* ---------- Hero ---------- */
.hero{
  max-width:780px;
  animation:fadeUp 1.6s ease both
}

.hero h1{
  font-family:'Cinzel Decorative',serif;
  font-weight:900;
  font-size:clamp(2rem,6vw,3.6rem);
  line-height:1.15;
  background:linear-gradient(180deg,#fff6d4,#d4af37 60%,#8a6418);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  margin-bottom:1rem
}

.hero p{
  font-size:clamp(1rem,2.2vw,1.25rem);
  font-style:italic;
  color:var(--branco);
  opacity:.85;
  margin-bottom:2.2rem;
  line-height:1.6
}

.cta{
  display:inline-block;
  padding:1rem 2.4rem;
  cursor:pointer;
  font-family:'Cinzel Decorative',serif;
  font-weight:700;
  font-size:1rem;
  letter-spacing:.25em;
  color:#1a0625;
  background:linear-gradient(135deg,#f5d97a,#d4af37 50%,#8a6418);
  border:none;
  border-radius:50px;
  transition:transform .35s ease
}

.cta:hover{
  transform:translateY(-3px)
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(40px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

/* ---------- Cartas ---------- */
.deck{
  display:flex;
  justify-content:center;
  gap:2rem;
  flex-wrap:wrap;
  margin-top:3rem
}

.card{
  width:220px;
  height:360px;
  position:relative;
  cursor:pointer;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(180deg,#4a0e2c,#1a0625);
  border:2px solid var(--dourado);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--dourado);
  font-size:4rem;
  transition:.4s
}

.card:hover{
  transform:translateY(-10px) scale(1.03);
  box-shadow:0 0 30px var(--dourado-glow)
}

footer{
  position:relative;
  z-index:10;
  text-align:center;
  padding:2rem 1rem;
  font-size:.8rem;
  opacity:.5
}

@media (max-width:600px){

  .deck{
    gap:1rem
  }

  .card{
    width:28vw;
    height:180px;
    font-size:2rem
  }

}
</style>
</head>

<body>

<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>
<div class="fog"></div>

<div class="particles" id="particles"></div>

<header class="topbar">
  <div class="brand">
    ORÁCULO MÍSTICO
  </div>

  <div class="controls">
    <button class="ctrl">🔊 Voz</button>
    <button class="ctrl">🎵 Música</button>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Descubra o que o destino revela para você</h1>

    <p>
      Respire fundo, acalme o coração e permita que os arcanos
      revelem a verdade que o universo guarda para você.
    </p>

    <button class="cta">
      Iniciar leitura
    </button>

    <!-- ANÚNCIO ADSENSE -->
    <div style="margin-top:40px; display:flex; justify-content:center;">

      <ins class="adsbygoogle"
           style="display:block; width:100%; max-width:728px; height:90px"
           data-ad-client="ca-pub-3244338845125533"
           data-ad-slot="1234567890"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>

    </div>

  </section>

  <section class="deck">

    <div class="card">✦</div>
    <div class="card">☽</div>
    <div class="card">☀</div>

  </section>

</main>

<footer>
✦ Oráculo Místico · feito com luz, mistério e estrelas ✦
</footer>

<script>

/* ADSENSE */
(adsbygoogle = window.adsbygoogle || []).push({});

/* Partículas */
(function(){
  const wrap=document.getElementById("particles");

  for(let i=0;i<40;i++){

    const p=document.createElement("div");

    p.className="particle";

    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=(8+Math.random()*14)+"s";
    p.style.animationDelay=(Math.random()*10)+"s";

    wrap.appendChild(p);
  }
})();

</script>

</body>
</html>
